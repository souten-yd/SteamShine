name: Release SteamShine v1.11

on:
  push:
    branches: ['release/v1.11']
    paths: ['.github/workflows/release-v1.11.yml']

permissions:
  actions: read
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Verify full-validation provenance
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: '36497280788'
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" >source-run.json
          test "$(jq -r .conclusion source-run.json)" = success
          test "$(jq -r .head_sha source-run.json)" = df69ed734184198af017702bc1a7ee9f1ab3456a
          test "$(jq -r .name source-run.json)" = 'SteamOS Runtime Build'
          test "$(jq -r .head_repository.full_name source-run.json)" = "${GITHUB_REPOSITORY}"
          jq '{source_run_id: .id, source_sha: .head_sha, source_workflow: .name, source_url: .html_url}' source-run.json >release-provenance.json
      - name: Download validated artifact without rebuilding
        uses: actions/download-artifact@v4
        with:
          name: steamshine-steamos-x86_64-df69ed734184198af017702bc1a7ee9f1ab3456a
          run-id: 36497280788
          github-token: ${{ github.token }}
          path: artifact
      - name: Verify promoted payload and metadata
        run: |
          set -euo pipefail
          artifact="$(find artifact -maxdepth 1 -name 'steamshine-steamos-x86_64-*.tar.zst' -print -quit)"
          test -n "${artifact}"
          checksum="${artifact}.sha256"
          test -f "${checksum}"
          (cd "$(dirname "${artifact}")" && sha256sum -c "$(basename "${checksum}")")
          tar --zstd -tf "${artifact}" >artifact-entries.txt
          grep -Eq '(^|/)BUILD_INFO\.json$' artifact-entries.txt
          grep -Eq '(^|/)RUNTIME_DEPENDENCIES\.txt$' artifact-entries.txt
          printf 'artifact=%s\nchecksum=%s\n' "${artifact}" "${checksum}" >>"${GITHUB_ENV}"
      - name: Create release from the validated binary
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.11
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" "${artifact}" "${checksum}" release-provenance.json \
            --repo "${GITHUB_REPOSITORY}" \
            --target "$(jq -r .source_sha release-provenance.json)" \
            --title "SteamShine ${RELEASE_TAG}" \
            --notes "Promoted without rebuild from successful SteamOS Runtime Build run 36497280788."
